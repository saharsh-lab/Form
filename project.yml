# Form — XcodeGen project specification.
# Generate the Xcode project with:  xcodegen generate
name: Form
options:
  bundleIdPrefix: com.example.form
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer team here (or in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Change these two together if you change the bundle identifier.
    FORM_BUNDLE_ID: com.example.form
    FORM_APP_GROUP: group.com.example.form
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  FormCore:
    path: Packages/FormCore

targets:
  Form:
    type: application
    platform: iOS
    sources:
      - path: Form
      - path: Shared
    dependencies:
      - package: FormCore
      - target: FormWidgets
        embed: true
    entitlements:
      path: Form/Form.entitlements
      properties:
        com.apple.security.application-groups:
          - $(FORM_APP_GROUP)
    info:
      path: Form/Info.plist
      properties:
        CFBundleDisplayName: Form
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        FormAppGroupIdentifier: $(FORM_APP_GROUP)
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: $(FORM_BUNDLE_ID)
            CFBundleURLSchemes:
              - form
    settings:
      base:
        PRODUCT_NAME: Form
        PRODUCT_MODULE_NAME: FormApp
        PRODUCT_BUNDLE_IDENTIFIER: $(FORM_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO

  FormWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FormWidgets
      - path: Shared
      # Design tokens and number formatting are shared with the app.
      - path: Form/DesignSystem/Theme.swift
      - path: Form/DesignSystem/NumberText.swift
    dependencies:
      - package: FormCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: FormWidgets/FormWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(FORM_APP_GROUP)
    info:
      path: FormWidgets/Info.plist
      properties:
        CFBundleDisplayName: Form
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FormAppGroupIdentifier: $(FORM_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: FormWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(FORM_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  FormTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FormTests
    dependencies:
      - target: Form
      - package: FormCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(FORM_BUNDLE_ID).tests

schemes:
  Form:
    build:
      targets:
        Form: all
        FormTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - FormTests
    archive:
      config: Release
